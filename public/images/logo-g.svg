<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Arch/Shield Cartographic Border -->
  <rect x="5" y="5" width="90" height="90" rx="12" fill="#0d1e18" stroke="#28b26f" stroke-width="3"/>
  <rect x="10" y="10" width="80" height="80" rx="8" fill="none" stroke="#28b26f" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Old English Gothic 'G' letterform -->
  <text x="50" y="68" font-family="'UnifrakturMaguntia', 'UnifrakturCook', Georgia, serif" font-weight="700" font-size="58" fill="#28b26f" text-anchor="middle">G</text>
  <!-- Tiny Cardinal Coordinate markers -->
  <circle cx="50" cy="18" r="1.5" fill="#28b26f" />
  <circle cx="50" cy="82" r="1.5" fill="#28b26f" />
  <circle cx="18" cy="50" r="1.5" fill="#28b26f" />
  <circle cx="82" cy="50" r="1.5" fill="#28b26f" />
</svg>
